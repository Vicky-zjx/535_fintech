name: Nightly risk-managed Wheel

on:
  schedule:
    - cron: '0 22 * * *'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: read

# Shared with the existing chart refresh: avoid concurrent Platform logins.
concurrency:
  group: fin535-platform-main
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: final_project/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r final_project/requirements.txt
      - name: Offline dry run and regression tests (no credentials)
        run: |
          python -W ignore::DeprecationWarning -m unittest final_project.test_strategy lseg_chart.test_update -v
          python -m unittest discover -s tests -p 'test_site_layout.py' -v
          node --test lseg_chart/test_page.cjs
          node --test final_project/test_page.cjs
          python -m final_project.validate_publication
      - name: Query completed data and plan simulated orders
        id: plan
        continue-on-error: true
        env:
          LSEG_APP_KEY: ${{ secrets.LSEG_APP_KEY }}
          LSEG_USERNAME: ${{ secrets.LSEG_USERNAME }}
          LSEG_PASSWORD: ${{ secrets.LSEG_PASSWORD }}
        run: python -m final_project.run
      - name: Validate public output (also after a blocked evaluation)
        run: python -m final_project.validate_publication
      - name: Commit only generated public outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in open_orders.json mkt/open_orders.json docs/data/strategy_status.json docs/data/market_snapshot.json; do
            if test -f "$path"; then git add -- "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update Final Project decisions and validated order outputs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Rebuild existing GitHub Pages source (main/root)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds" --jq '{status, url}'
      - name: Report blocked evaluation honestly
        if: steps.plan.outcome == 'failure'
        run: |
          echo '::error::Live evaluation blocked. Diagnostics published; existing orders preserved. See docs/data/strategy_status.json.'
          exit 1
