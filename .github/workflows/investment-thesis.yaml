name: Update investment thesis tracker

on:
  # The existing nightly LSEG job remains unchanged. Use its validated outputs.
  workflow_run:
    workflows: ['Nightly risk-managed Wheel']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fin535-investment-thesis-main
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout trusted main (not triggering workflow artifacts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: final_project/requirements.txt
      - name: Install existing pinned research dependencies
        run: python -m pip install -r final_project/requirements.txt
      - name: Test research without credentials or order writes
        # Full frozen-reference/download tests remain local. Hosted smoke tests
        # must not require publishing the private original price reference.
        run: python -W ignore::DeprecationWarning -m unittest investment_thesis.test_research investment_thesis.test_reliability investment_thesis.test_workflow_isolation -q
      - name: Rebuild and validate, or retain evidence with an explicit failure status
        id: refresh
        continue-on-error: true
        env:
          UPSTREAM: ${{ github.event_name == 'workflow_dispatch' && 'manual' || github.event.workflow_run.conclusion }}
        # Internally runs python -m investment_thesis.research's build and validation.
        run: python -m investment_thesis.refresh --upstream "$UPSTREAM" --verify-page
      - name: Check release isolation without a private historical reference
        if: steps.refresh.outcome == 'success'
        run: python -W ignore::DeprecationWarning -m unittest investment_thesis.test_release -q
      # A narrowly scoped owner-authorized course release is not a claim of
      # separate vendor approval. Raw runtime outputs are never staged.
      - name: Verify recorded course scope before any publication
        run: python -m investment_thesis.publication --require-approval
      - name: Commit only approved aggregate thesis outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- investment-thesis/data/public_tracker.json investment-thesis/data/refresh_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update independent investment thesis evidence'
            git pull --rebase origin main
            # Do not publish mixed source generations after a concurrent refresh.
            if [ '${{ steps.refresh.outcome }}' = 'success' ]; then python -m investment_thesis.validate; fi
            git push origin HEAD:main
          fi
      - name: Rebuild existing GitHub Pages site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds" --jq '{status, url}'
      - name: Report a failed refresh honestly after publishing retained-evidence status
        if: steps.refresh.outcome == 'failure'
        run: |
          echo '::error::Tracker not refreshed. Previous evidence retained; see refresh_status.json.'
          exit 1
