name: Update investment thesis tracker

on:
  # The existing nightly LSEG job remains unchanged. Use its validated outputs.
  workflow_run:
    workflows: ['Nightly risk-managed Wheel']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fin535-investment-thesis-main
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout trusted main (not triggering workflow artifacts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: final_project/requirements.txt
      - name: Install existing pinned research dependencies
        run: python -m pip install -r final_project/requirements.txt
      - name: Test research without credentials or order writes
        run: python -W ignore::DeprecationWarning -m unittest investment_thesis.test_research -q
      - name: Rebuild independent tracker from retained real LSEG observations
        run: python -m investment_thesis.research
      - name: Validate source alignment, charts and standalone page
        run: |
          python -m investment_thesis.validate
          node --test investment_thesis/test_page.cjs
      - name: Commit only thesis outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- investment-thesis/data/thesis_tracker.json investment-thesis/data/thesis_observations.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update independent investment thesis evidence'
            git pull --rebase origin main
            # Do not publish mixed source generations after a concurrent refresh.
            python -m investment_thesis.validate
            git push origin HEAD:main
          fi
      - name: Rebuild existing GitHub Pages site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds" --jq '{status, url}'
