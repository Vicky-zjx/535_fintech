name: Update LSEG Plotly chart

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lseg_chart/update.py'
      - 'lseg_chart/page.py'
      - 'lseg_chart/local_api.py'
      - 'lseg_chart/test_update.py'
      - 'lseg_chart/test_page.cjs'
      - 'tests/test_site_layout.py'
      - 'lseg_chart/requirements.txt'
      - '.github/workflows/lseg-plot.yml'

permissions:
  contents: read

concurrency:
  group: lseg-plotly-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: lseg_chart/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r lseg_chart/requirements.txt
      - name: Test validation and publication (offline)
        run: python -m unittest lseg_chart.test_update -v
      - name: Test instrument-driven page labels (offline)
        run: node --test lseg_chart/test_page.cjs
      - name: Check site links and canonical data layout (offline)
        run: python -m unittest discover -s tests -p 'test_site_layout.py' -v
      - name: Query LSEG Platform and save Plotly chart
        env:
          LSEG_APP_KEY: ${{ secrets.LSEG_APP_KEY }}
          LSEG_USERNAME: ${{ secrets.LSEG_USERNAME }}
          LSEG_PASSWORD: ${{ secrets.LSEG_PASSWORD }}
        run: python -m lseg_chart.update
      - name: Commit only the generated public chart files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lseg-live/chart.html lseg-live/data.json lseg-live/prices.csv lseg-local/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update real LSEG Plotly charts'
            git push origin HEAD:main
          fi
      # A GITHUB_TOKEN commit does not itself trigger a legacy Pages build.
      # Keep the existing main/root publishing source; explicitly request a build.
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds" --jq '{status, url}'
