<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1100" viewBox="0 0 560 1100" role="img" aria-labelledby="title desc">
 <title id="title">Nightly multi-asset Wheel workflow</title><desc id="desc">GitHub Actions runs at 10 PM New York. Read completed LSEG prices, option and earnings data, and the Sanji account for BAC, KO, PFE and F. Inspect current positions and pending orders. Flat accounts screen first-weekly-session puts; stock positions screen covered calls. Check exposure, collateral and reserves, then write both order files and publish diagnostics. Missing inputs preserve prior orders. Sanji assignment moves puts to shares and calls back to cash.</desc>
 <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#7f9aaf" stroke-width="1.3"/></marker></defs>
 <style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#182b3a;text-anchor:middle}.head{font-size:22px;font-weight:650}.body{font-size:19px;fill:#526b7d}.small{font-size:17px;fill:#526b7d}.box{fill:#fff;stroke:#c9d7e2;stroke-width:1.5}.blue{fill:#edf3f8;stroke:#9bb7cb;stroke-width:1.5}.line{fill:none;stroke:#7f9aaf;stroke-width:1.5;marker-end:url(#arrow)}</style>
 <rect x="20" y="10" width="520" height="85" rx="4" fill="#182b3a"/><text x="280" y="44" style="fill:white" class="head">10:00 PM · America/New_York</text><text x="280" y="73" style="fill:#bdcedb" class="body">GitHub Actions · DST-aware</text>
 <path d="M280 95V123" class="line"/>
 <rect x="20" y="130" width="520" height="118" rx="4" class="box"/><text x="280" y="163" class="head">Read &amp; validate inputs</text><text x="280" y="193" class="body">LSEG closes · options · earnings</text><text x="280" y="221" class="body">Sanji cash · positions · pending orders</text>
 <path d="M280 248V276" class="line"/>
 <rect x="20" y="283" width="520" height="87" rx="4" class="blue"/><text x="280" y="317" class="head">BAC · KO · PFE · F</text><text x="280" y="345" class="body">Inspect the current Wheel phase</text>
 <path d="M280 370V389H140V409" class="line"/><path d="M280 389H420V409" class="line"/>
 <rect x="20" y="416" width="240" height="193" rx="4" class="box"/><text x="140" y="449" class="head">Cash → put</text><text x="140" y="481" class="body">First weekly session</text><text x="140" y="511" class="body">SMA trend + HV20</text><text x="140" y="541" class="body">R5 + earnings check</text><text x="140" y="576" class="small">No stock / short option</text>
 <rect x="300" y="416" width="240" height="193" rx="4" class="box"/><text x="420" y="449" class="head">Shares → call</text><text x="420" y="481" class="body">≥ 100 eligible shares</text><text x="420" y="511" class="body">No covering call</text><text x="420" y="541" class="body">Cost + price floors</text><text x="420" y="576" class="small">Any next session</text>
 <path d="M140 609V632H280V651" class="line"/><path d="M420 609V632H280" fill="none" stroke="#7f9aaf" stroke-width="1.5"/>
 <rect x="20" y="658" width="520" height="100" rx="4" class="blue"/><text x="280" y="692" class="head">Select contract &amp; reserve capital</text><text x="280" y="722" class="body">3–10 DTE · observed strikes · delta / fallback</text><text x="280" y="746" class="small">30% per name · 70% total · 30% free cash</text>
 <path d="M280 758V783" class="line"/>
 <rect x="20" y="790" width="520" height="78" rx="4" class="box"/><text x="280" y="822" class="head">Validate one array → write both paths</text><text x="280" y="850" class="small">open_orders.json = mkt/open_orders.json</text>
 <path d="M280 868V889" class="line"/>
 <rect x="20" y="896" width="520" height="67" rx="4" class="box"/><text x="280" y="924" class="head">Commit outputs → publish Pages</text><text x="280" y="949" class="small">Data failure: preserve orders, publish the reason</text>
 <rect x="20" y="993" width="520" height="94" rx="4" fill="#e8eef3"/><text x="280" y="1024" class="head">The assignment cycle · managed by Sanji</text><text x="280" y="1053" class="body">Cash → short put → shares → covered call</text><text x="280" y="1077" class="small">Called away → cash · unassigned → retain phase</text>
</svg>
